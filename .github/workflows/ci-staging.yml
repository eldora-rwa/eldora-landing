name: ci

on:
  push:
    branches: ["staging"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/eldora-rwa/eldora-landing/eldora-stag/eldora-landing-stag

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      pushed: ${{ steps.gate.outputs.push }}

    steps:
      - uses: actions/checkout@v4

      # Only staging publishes an image. Pull requests and manual runs from
      # other branches verify the image build without shipping unmerged code.
      - name: Decide whether to push
        id: gate
        run: |
          if [ "${{ github.ref }}" = "refs/heads/staging" ] \
            && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: steps.gate.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ steps.gate.outputs.push == 'true' }}
          build-args: |
            BUILD_MODE=staging
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
