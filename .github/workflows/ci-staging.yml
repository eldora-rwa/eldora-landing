name: ci

on:
  push:
    branches: ["staging"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/eldora-rwa/eldora-landing/eldora-stag/eldora-landing-stag

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.tags.outputs.sha }}

    steps:
      - uses: actions/checkout@v4

      # Every run publishes :<git-sha>, pull requests included, so
      # argocd-image-updater (updateStrategy newest-build, allowTags
      # ^[0-9a-f]{40}$) rolls the build onto the staging cluster. That means the
      # newest PR build wins staging until the next push — intentional.
      #
      # :latest is still branch-only. Nothing deploys from it (the gitops
      # overlay pins newTag to a sha), so it stays a human-facing "this is
      # staging HEAD" pointer rather than whichever PR built last.
      - name: Resolve tags
        id: tags
        run: |
          # On pull_request, github.sha is the throwaway merge commit; tag the
          # PR head instead so the image maps to a commit that exists.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ github.ref }}" = "refs/heads/staging" ] \
            && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            BUILD_MODE=staging
          tags: |
            ${{ env.IMAGE }}:${{ steps.tags.outputs.sha }}
            ${{ steps.tags.outputs.latest == 'true' && format('{0}:latest', env.IMAGE) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
