name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One run per ref: concurrent pushes must not race for the :latest tag.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/eldora-rwa/eldora-landing/eldora-prod/eldora-landing-prod

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pushed: ${{ steps.gate.outputs.push }}

    steps:
      - uses: actions/checkout@v4

      # Only the main branch publishes an image. Pull requests (and a manual
      # dispatch on any other branch) build and verify but never push: the
      # production Deployment tracks :latest with imagePullPolicy: Always, so
      # any other push would ship unmerged code straight to the cluster.
      - name: Decide whether to push
        id: gate
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] \
            && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      # Vite inlines VITE_* at build time, so the values must exist inside the
      # image build, not in the Pod. `vite build --mode production` (see
      # Dockerfile) loads .env.production; it is gitignored and written here so
      # the image is pinned to the production API.
      - name: Write .env.production
        run: |
          cat > .env.production <<'ENV'
          VITE_API_BASE_URL=https://api.eldora.do
          ENV

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: steps.gate.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ steps.gate.outputs.push == 'true' }}
          build-args: |
            BUILD_MODE=production
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
